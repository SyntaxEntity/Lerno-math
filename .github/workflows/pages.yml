# 发布 math2-site 到 GitHub Pages。
#
# 仓库根 = 本目录（数学二/ + parts/ + 工具链）；站点是**构建产物**，
# 由 pack_site.py 在 CI 里生成后上传，不入库（见 .gitignore）。
# 这样部署的站点永远等于当前源码，也不会让每次改内容都产生一堆 HTML 差异。
#
# 为什么用工作流而不是「Deploy from a branch」：
#   1. 发布前跑**三道门禁**——`validate.py`（形式）、`reverse_tests.py`（规则本身必须
#      能被反例触发）、`verify_math.py`（数值），任一不过就不部署；分支部署没有任何
#      地方能挂这道门禁。
#      ⚠️ 步骤名与注释里**不写 F 范围**：手写的范围必然漂移（本文件就漂过一次），
#      真实范围由 `validate.py` 自己输出（PLAN-对齐与改版 §4.6）。
#   2. 自定义工作流不占用「每小时 10 次构建」的软性限制。
#
# 依赖版本**只从声明文件读，本文件里不写任何版本号**（PLAN-对齐与改版 §1.2）：
#   Python → 数学二/scripts/requirements.txt（CI 与校验所需的全部）
#   Node   → 数学二/scripts/tools-package.json（拷成 .tools/package.json 再装）
# 本地生成链路额外要的 matplotlib 在 requirements-dev.txt 里，CI 不装它——
# 图与 HTML 都已入库，CI 只校验与打包，**不重绘、不重生成产物**（§1.2.1）。
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 版本唯一来源是 requirements.txt（= CI 与校验所需的全部依赖）。
      # 本地绘图才要的 matplotlib 在 requirements-dev.txt 里，这里**不装**：
      # 图是已提交的 PNG，CI 不重绘，validate.py 的 F18 只查"每张图都有生成脚本"。
      - name: 安装 Python 依赖（读 requirements.txt）
        run: python3 -m pip install --quiet -r 数学二/scripts/requirements.txt

      # F3 用官方 mermaid 解析器逐块真解析（正则查不出「标签含圆括号未加引号」
      # 这类直接解析失败的写法）。版本必须与站点内置运行时、以及 .tools 下的
      # 本地依赖一致，否则校验的语法和线上渲染的不是同一个版本。
      # .tools/ 已 gitignore，检出时不存在，因此先把清单拷进去，再让 npm 按清单装。
      - name: 安装 Node 依赖（读 tools-package.json）
        run: |
          mkdir -p .tools
          cp 数学二/scripts/tools-package.json .tools/package.json
          npm install --prefix .tools --cache /tmp/npm-cache --no-audit --no-fund

      # 门禁 ①（形式）：模板字段、考频数字与 meta.py 逐字一致、图语法、ASCII 对齐、
      # 真题年份、链接可达、外壳完整性、渲染残留、解析排版、交付物完整性，
      # 以及 F26 元校验（规则集合 ≡ 反向测试覆盖集合、扫描型规则受检数 > 0）。
      - name: 发布前校验 · 形式
        run: python3 数学二/scripts/validate.py

      # 门禁 ②（元层）：反向测试——给每条规则注入反例，确认它真的会报错。
      # validate.py 证明的是「当前内容合规」，这一步证明的是「规则本身有效」；
      # 少了它，一条判据写错的规则可以永远全绿（本项目吃过这个亏）。
      # 它会**临时改文件再还原**，所以必须排在打包之前，且脚本保证无论成败都还原。
      - name: 发布前校验 · 反向测试（规则本身必须能被触发）
        run: python3 数学二/scripts/reverse_tests.py

      # 门禁 ③（数值）：sympy 独立复算资料里出现的每一个数值结果，含
      # 「图上标注的关键点坐标 == 符号计算值」。这是本仓库最强的正确性保证，
      # 以前只在本地 run_all.py 里跑、门禁完全没有它——那等于最强的校验游离在
      # 发布路径之外。只依赖 sympy，跑一次约 1.5 秒。
      # 缺 sympy 时它并非静默跳过：模块级 `import sympy` 直接失败、退出码非 0。
      - name: 发布前校验 · 数值（sympy 断言）
        run: python3 数学二/scripts/verify_math.py

      # pack_site.py 只用标准库（os/re/shutil/sys）。
      # 输出目录不含 .git/.github，因此不会触发它的 VCS 保护。
      - name: 打包站点
        run: python3 数学二/scripts/pack_site.py math2-site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: math2-site

      - id: deployment
        uses: actions/deploy-pages@v4
